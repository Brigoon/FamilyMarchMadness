<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>March Madness Bracket — Scoreboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="site-header">
    <h1><span class="emoji">🏀</span> March Madness Bracket</h1>
    <nav class="site-nav">
      <a href="index.html" class="active">Scoreboard</a>
      <a href="submit.html">Submit Bracket</a>
      <a href="hall-of-fame.html">Hall of Fame</a>
    </nav>
  </header>

  <main class="container container-narrow">
    <div id="scoreboard-loading" class="loading">Loading scoreboard…</div>
    <div id="scoreboard-error" class="error-msg" style="display:none;"></div>
    <div id="reveal-banner" class="info-banner" style="display:none;"></div>

    <table class="scoreboard-table" id="scoreboard-table" style="display:none;">
      <thead>
        <tr>
          <th class="rank">#</th>
          <th>Name</th>
          <th>Score</th>
          <th>Max Possible</th>
        </tr>
      </thead>
      <tbody id="scoreboard-body"></tbody>
    </table>

    <div id="last-updated" class="last-updated" style="display:none;"></div>

    <div id="hof-export" class="export-panel" style="display:none;">
      <h3>Archive this season</h3>
      <p>Copy this entry into the <code>seasons</code> array in <code>hall-of-fame.json</code> and commit.</p>
      <label>Year <input type="number" id="hof-year" class="name-input" style="width:100px;"></label>
      <textarea id="hof-json" class="export-text" readonly rows="10"></textarea>
      <button class="btn btn-secondary" id="hof-copy">Copy</button>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    (function () {
      const loadingEl = document.getElementById('scoreboard-loading');
      const errorEl = document.getElementById('scoreboard-error');
      const tableEl = document.getElementById('scoreboard-table');
      const tbodyEl = document.getElementById('scoreboard-body');
      const updatedEl = document.getElementById('last-updated');
      const bannerEl = document.getElementById('reveal-banner');

      async function refreshScoreboard() {
        try {
          const [tournament, results, submissions] = await Promise.all([
            loadTournament(),
            loadResults(),
            loadSubmissions(),
          ]);
          const allPicks = submissions.brackets;

          if (submissions.revealed) {
            bannerEl.style.display = 'none';
          } else {
            bannerEl.textContent = submissions.deadline
              ? `Brackets are hidden until the deadline: ${submissions.deadline.toLocaleString()}.`
              : 'Brackets are hidden until the deadline is set.';
            bannerEl.style.display = 'block';
          }

          if (allPicks.length === 0) {
            loadingEl.style.display = 'none';
            errorEl.textContent = 'No brackets have been submitted yet.';
            errorEl.style.display = 'block';
            tableEl.style.display = 'none';
            return;
          }

          // Score each participant
          const scores = allPicks.map(p => scorePicks(p, results, tournament));

          // Sort: by current score desc, then max possible desc
          scores.sort((a, b) => {
            if (b.currentScore !== a.currentScore) return b.currentScore - a.currentScore;
            return b.maxPossible - a.maxPossible;
          });

          // Render
          tbodyEl.innerHTML = '';
          scores.forEach((s, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="rank">${i + 1}</td>
              <td class="name">${escapeHtml(s.name)}</td>
              <td class="score">${s.currentScore}</td>
              <td class="max-possible">${s.maxPossible}</td>
            `;
            // Encode the submitter name for the bracket link
            const nameParam = encodeURIComponent(s.name.toLowerCase().replace(/\s+/g, '-'));
            tr.addEventListener('click', () => {
              // Find the matching pick filename from manifest
              // We'll match by submitter name
              window.location.href = `bracket.html?name=${nameParam}`;
            });
            tbodyEl.appendChild(tr);
          });

          loadingEl.style.display = 'none';
          tableEl.style.display = 'table';
          updatedEl.style.display = 'block';
          updatedEl.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
          setupExport(scores, results, submissions);
        } catch (err) {
          loadingEl.style.display = 'none';
          errorEl.textContent = `Error loading data: ${err.message}`;
          errorEl.style.display = 'block';
        }
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      const exportEl = document.getElementById('hof-export');
      const yearEl = document.getElementById('hof-year');
      const jsonEl = document.getElementById('hof-json');
      let exportState = null;

      function renderExport() {
        const year = parseInt(yearEl.value, 10);
        const season = buildSeasonSnapshot(exportState.scores, exportState.results, year);
        jsonEl.value = JSON.stringify(season, null, 2);
      }

      /** Offer the Hall of Fame export once the tournament is over. */
      function setupExport(scores, results, submissions) {
        if (!results.championship || !submissions.revealed) {
          exportEl.style.display = 'none';
          return;
        }
        const firstTime = !exportState;
        exportState = { scores, results };
        if (firstTime) {
          yearEl.value = (submissions.deadline || new Date()).getFullYear();
          yearEl.addEventListener('input', renderExport);
          document.getElementById('hof-copy').addEventListener('click', () => {
            navigator.clipboard.writeText(jsonEl.value);
          });
        }
        renderExport();
        exportEl.style.display = 'block';
      }

      // Initial load
      refreshScoreboard();

      // Auto-refresh every 60 seconds
      setInterval(refreshScoreboard, 60000);
    })();
  </script>
</body>
</html>
